, Arial, sans-serif" font-size="15" fill="#c9d1d9">Background jobs on pg-boss, OpenTelemetry tracing</text><circle cx="666" cy="143" r="3.5" fill="#38bdf8"/><text x="682" y="148" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c9d1d9">Live updates via SSE + Postgres notifications</text><circle cx="666" cy="175" r="3.5" fill="#38bdf8"/><text x="682" y="180" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c9d1d9">Embeddable web-chat widget</text><circle cx="666" cy="207" r="3.5" fill="#38bdf8"/><text x="682" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c9d1d9">Bilingual AR / EN with full RTL</text><rect x="32.0" y="230" width="96.5" height="26" rx="13" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".35"/><text x="80.2" y="247.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#38bdf8">Next.js 15</text><rect x="136.5" y="230" width="96.5" height="26" rx="13" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".35"/><text x="184.8" y="247.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#38bdf8">TypeScript</text><rect x="241.0" y="230" width="82.0" height="26" rx="13" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".35"/><text x="282.0" y="247.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#38bdf8">Prisma 7</text><rect x="331.0" y="230" width="96.5" height="26" rx="13" fill="#38bdf8" fill-opacity=".10" stroke="#38bdf8" stroke-opacity=".35"/><text x="379.2" y="247.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" 